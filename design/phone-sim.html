<!DOCTYPE html>
<html lang="zh-CN" class="native">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<title>砚读 · 手机模拟</title>
<link rel="stylesheet" href="../www/css/style.css">
</head>
<body>

<!-- ============ 书架 ============ -->
<section id="page-shelf" class="page active">
  <header class="shelf-head">
    <div>
      <h1>砚读</h1>
      <p class="shelf-sub" id="shelf-sub">离线小说阅读器</p>
    </div>
    <button id="btn-edit" class="btn-ghost">编辑</button>
  </header>

  <!-- 架子自己撑满剩下的高度（svg 会按比例缩放到能放下的最大尺寸），
       下面的提示跟着架子走，不再另开一块空状态跟它抢地方 -->
  <div class="shelf-stage">
    <!-- 继续阅读：夹在书架上的一张便签。左边那根竖条是这本书在架子上的书脊色，
         没读过任何书时整条 display:none，完全不占位 —— 架子照旧居中。 -->
    <button class="continue-card" id="btn-continue" style="display:none">
      <i class="cc-spine" id="cc-spine"></i>
      <span class="cc-main">
        <span class="cc-name" id="cc-name"></span>
        <span class="cc-sub" id="cc-sub"></span>
      </span>
      <span class="cc-go">续读 ›</span>
      <span class="cc-bar"><i id="cc-bar"></i></span>
    </button>
    <div class="shelf-canvas" id="shelf-stage"></div>
    <!-- 提示和花名册挤在同一行：以前它们各占一行，架子下面拖出两大块留白，
         看着就像"东西没摆完就掉了"。 -->
    <div class="shelf-foot">
      <div id="shelf-tip" class="shelf-tip"></div>
      <button class="roster-btn" id="btn-roster" style="display:none">花名册</button>
    </div>
  </div>

  <div id="edit-bar" class="edit-bar">
    <span id="edit-bar-text">点虚线框加书，点书移除</span>
    <div class="edit-acts">
      <button class="pill sm" id="btn-fill">一键摆满</button>
      <button class="pill sm" id="btn-clear">清空</button>
    </div>
  </div>
</section>

<!-- ============ 书库列表 ============ -->
<section id="page-list" class="page">
  <header class="list-head">
    <h1>书库</h1>
    <button id="btn-list-import" class="btn-ghost">+ 导入</button>
  </header>

  <div class="search-box">
    <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
    </svg>
    <input id="search-input" type="search" placeholder="搜索书名" autocomplete="off">
    <button id="search-clear" class="search-clear" aria-label="清空">×</button>
  </div>

  <div id="list-body" class="list-body"></div>
  <div id="list-empty" class="empty" style="display:none"></div>
</section>

<!-- ============ 阅读 ============ -->
<section id="page-reader" class="page">
  <!-- 顶栏：左边「返回」，右边「更多」。
       「更多」是留给以后扩展的入口，现在按下只是给个提示。 -->
  <div class="reader-head" id="reader-head">
    <button id="btn-back" class="rd-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      <span>返回</span>
    </button>
    <div class="reader-title" id="reader-title">　</div>
    <button id="btn-more" class="rd-more">
      <svg viewBox="0 0 24 24" fill="currentColor" class="dots">
        <circle cx="12" cy="5.6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18.4" r="1.5"/>
      </svg>
      <span>更多</span>
    </button>
  </div>

  <!-- 整本书在这里读成一条连续的长书页：
       #chapter-content 里挂的是若干 .chapter-block（一章一块，标题跟着自己那一块走），
       滑到哪就在头尾接着补一节，离得远的卸掉 —— 所以这里不再有"翻章"这回事。
       ⚠️ 章节标题以前是这儿孤零零的一个 h2，一条卷轴里放不下第二个，第二章就没名字了。 -->
  <div class="reader-body" id="reader-body">
    <div class="chapter-content" id="chapter-content"></div>
  </div>

  <!-- 页尾遮罩（只在分页模式下出现）：
       内容是一条连续的长书页，所以"下一页的第一段"总会在页底露出个开头。
       这条跟背景同色的块从"本页最后一段的底"一直盖到屏幕底，页尾就干净了 ——
       纸质书的页尾留白就是这个观感。它在栏下面（z-index 比栏小），不吃点击。 -->
  <div class="page-tail" id="page-tail"></div>

  <!-- 底栏分两段：
       上段 = 当前章节标题 + 「上一章 / 进度条 / 下一章」
       下段 = 四个带文字的功能键：目录 / 夜间 / 亮度 / 设置
       ⚠️ 整条底栏是浮在正文上的（absolute），显示隐藏只动 transform + opacity，
          正文的 padding 一次都不改 —— 见 CSS 里那段"v-show 而不是 v-if"。 -->
  <div class="reader-foot" id="reader-foot">
    <div class="foot-chap">
      <div class="fc-title" id="fc-title">　</div>
      <div class="fc-row">
        <button class="fc-btn" id="btn-prev">上一章</button>
        <div class="fc-bar" id="fc-bar" role="slider" aria-label="章节进度">
          <i class="fc-dot" id="fc-dot"></i>
        </div>
        <button class="fc-btn" id="btn-next">下一章</button>
      </div>
    </div>
    <div class="foot-menu">
      <button class="fm-btn" id="btn-toc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>目录</span>
      </button>
      <button class="fm-btn" id="btn-night">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.6A8.4 8.4 0 1 1 9.4 4a6.7 6.7 0 0 0 10.6 10.6z"/></svg>
        <span>夜间</span>
      </button>
      <button class="fm-btn" id="btn-light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg>
        <span>亮度</span>
      </button>
      <button class="fm-btn" id="btn-set">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
        <span>设置</span>
      </button>
    </div>
  </div>

  <!-- 自动翻页正在跑时才出现的小胶囊（右下角，在底栏上方）。
       点一下把「速度」面板叫回来 —— 平时面板是收着的，不挡正文。 -->
  <button class="ap-pill" id="ap-pill">自动 <b id="ap-speed">19</b> ›</button>

  <!-- 左侧目录侧滑面板：顶部书籍信息 + 中部目录列表 + 右侧悬浮胶囊滚动条。
       面板宽 78%，右边缘微圆角；右边剩下的屏幕是半透明黑遮罩。 -->
  <div class="drawer" id="drawer-toc">
    <div class="drawer-mask" id="toc-mask"></div>
    <div class="drawer-inner">
      <div class="toc-book">
        <!-- 书名用多行排版，不截断：长书名换行显示，比一行省略号好认 -->
        <div class="tb-title" id="toc-title">　</div>
        <div class="tb-sub">
          <span class="tb-meta" id="toc-meta">　</span>
          <button class="tb-order" id="toc-order">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 4.5 4.6 8 8 11.5M16 19.5 19.4 16 16 12.5"/>
              <path d="M4.6 8h14.8M19.4 16H4.6"/>
            </svg>
            <span>倒序</span>
          </button>
        </div>
      </div>

      <div class="toc-body">
        <div class="toc-list" id="toc-list"></div>
        <!-- 悬浮的胶囊滚动条：上下箭头 + 可拖的滑块。
             手机上原生滚动条是隐藏的，几千章的目录没有它就不知道自己翻到哪了。 -->
        <div class="toc-sbar" id="toc-sbar">
          <button class="sb-arrow" id="sb-up" aria-label="往上一屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 14.5 12 9l5.5 5.5"/></svg>
          </button>
          <div class="sb-track" id="sb-track"><i class="sb-thumb" id="sb-thumb"></i></div>
          <button class="sb-arrow" id="sb-down" aria-label="往下一屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5 12 15l5.5-5.5"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet-set">
    <div class="sheet-mask" id="set-mask"></div>
    <div class="sheet-inner">
      <div class="sheet-grip"></div>
      <div class="set-row">
        <span class="set-label">字号</span>
        <button class="step-btn" id="fs-minus">A-</button>
        <span class="set-val" id="fs-val">18</span>
        <button class="step-btn" id="fs-plus">A+</button>
      </div>
      <div class="set-row">
        <span class="set-label">行距</span>
        <button class="step-btn" id="lh-minus">紧</button>
        <span class="set-val" id="lh-val">1.8</span>
        <button class="step-btn" id="lh-plus">松</button>
      </div>
      <div class="set-row">
        <span class="set-label">字体</span>
        <div class="font-pick" id="font-pick">
          <button class="pill" data-font="sans">默认</button>
          <button class="pill" data-font="serif">宋体</button>
          <button class="pill" data-font="mono">等宽</button>
        </div>
      </div>
      <div class="set-row">
        <span class="set-label">主题</span>
        <div class="theme-pick" id="theme-pick">
          <button data-theme="paper" class="dot dot-paper"></button>
          <button data-theme="dark" class="dot dot-dark"></button>
          <button data-theme="green" class="dot dot-green"></button>
          <button data-theme="slate" class="dot dot-slate"></button>
        </div>
      </div>
      <div class="set-row">
        <span class="set-label">章节连续阅读</span>
        <div class="font-pick" id="auto-pick">
          <button class="pill" data-auto="1">开</button>
          <button class="pill" data-auto="0">关</button>
        </div>
      </div>
      <div class="set-row">
        <span class="set-label">亮度</span>
        <input type="range" id="brightness" min="20" max="100" value="100">
      </div>
      <div class="set-row set-actions">
        <button class="pill" id="btn-fullscreen">沉浸模式</button>
        <button class="pill" id="btn-bookmark">加书签</button>
      </div>
    </div>
  </div>

  <!-- ============ 阅读设置面板（底栏「设置」键弹出） ============
       四行：字号 / 背景 / 翻页 / 底部分隔行（自动翻页 · 更多阅读设置）
       ⚠️ 「翻页」这四个不是"分页"，是**跳章时怎么过渡** ——
          本 App 现在是一条连续的长书页，没有"页"可翻，所以这四个管的是
          点上一章/下一章、拖进度条跳章时的动画：
            覆盖 = 新内容从下往上滑上来   上下 = 直接跳（默认，最省电）
            仿真 = 带透视的立体翻一下     平滑 = 平滑滚过去（不瞬间跳） -->
  <div class="sheet" id="sheet-readset">
    <div class="sheet-mask" id="rs-mask"></div>
    <div class="sheet-inner rs-panel">
      <div class="sheet-grip"></div>

      <div class="rs-row">
        <span class="rs-label">字号</span>
        <div class="rs-body">
          <button class="rs-btn" id="rs-fs-minus">A-</button>
          <span class="rs-num" id="rs-fs-val">18</span>
          <button class="rs-btn" id="rs-fs-plus">A+</button>
          <button class="rs-btn rs-font" id="rs-font">
            <span id="rs-font-name">思源黑体</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
          </button>
        </div>
      </div>

      <div class="rs-row">
        <span class="rs-label">背景</span>
        <div class="rs-body rs-dots" id="rs-theme">
          <button class="rs-dot" data-theme="paper" aria-label="纸白"></button>
          <button class="rs-dot" data-theme="dark" aria-label="夜间"></button>
          <button class="rs-dot" data-theme="green" aria-label="护眼绿"></button>
          <button class="rs-dot" data-theme="slate" aria-label="青灰"></button>
        </div>
      </div>

      <!-- 「翻页方式」那一行已经撤掉了（2026-09-21 她定的：只保留上下滑动）。
           别再往回加 —— 真分页那套引擎还在代码里（paged() 恒 false 关着），
           但入口没了，也别让老设置把它打开。 -->

      <div class="rs-foot">
        <button class="rs-half" id="rs-auto">自动翻页 · 开</button>
        <i class="rs-vline" aria-hidden="true"></i>
        <button class="rs-half" id="rs-more">更多阅读设置</button>
      </div>
    </div>
  </div>

  <!-- ============ 自动翻页的速度面板（深色，贴在屏幕最底） ============
       手写风的字（楷体优先，没装就回落），第一行 速度/减速-/数值/加速+，
       第二行一条细线隔开，一个「退出自动翻页」的宽按钮。 -->
  <div class="sheet speed-sheet" id="sheet-speed">
    <div class="sheet-inner sp-panel">
      <div class="sp-row">
        <span class="sp-label">速度</span>
        <button class="sp-btn" id="sp-slow">减速 -</button>
        <span class="sp-val" id="sp-val">19</span>
        <button class="sp-btn" id="sp-fast">加速 +</button>
      </div>
      <div class="sp-exit-row">
        <button class="sp-exit" id="sp-exit">退出自动翻页</button>
      </div>
    </div>
  </div>

  <!-- ============ 字体面板（阅读设置里「思源… ›」弹出） ============ -->
  <div class="sheet" id="sheet-font">
    <div class="sheet-mask" id="font-mask"></div>
    <div class="sheet-inner">
      <div class="sheet-grip"></div>
      <div class="fp-row" data-font="sans"><i class="fp-check"></i><span>思源黑体</span><em>默认</em></div>
      <div class="fp-row" data-font="serif"><i class="fp-check"></i><span>思源宋体</span><em>宋体</em></div>
      <div class="fp-row" data-font="mono"><i class="fp-check"></i><span>等宽</span><em>等宽</em></div>
      <div class="fp-note">手机上没装思源的话，会回落到系统自带的同类中文字体
        （一般是 Noto CJK），字距仍然会跟着变。</div>
    </div>
  </div>

  <!-- ============ 亮度面板（底栏「亮度」键弹出） ============
       两行式：
         第一行 = 暗太阳 | 滑条（已激活轨道 + 圆滑块 + 未激活轨道）| 亮太阳
         第二行 = 「亮度跟随系统」文字 | 拨动开关
       ⚠️ 「跟随系统」= 砚读不压暗（把那层黑遮罩撤掉），亮度完全交给系统管；
          关掉才是砚读自己盖遮罩压暗 —— WebView 里读不到也改不了系统真实亮度，
          所以它的语义是"这层压暗归谁管"，不是"把系统亮度改成多少"。 -->
  <div class="sheet" id="sheet-light">
    <div class="sheet-mask" id="light-mask"></div>
    <div class="sheet-inner light-panel">
      <div class="sheet-grip"></div>
      <div class="lp-slider" id="lp-slider">
        <svg class="lp-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/>
          <path d="M12 5.2v1.9M12 16.9v1.9M5.2 12h1.9M16.9 12h1.9"/>
        </svg>
        <div class="lp-track" id="lp-track" role="slider" aria-label="亮度"
             aria-valuemin="20" aria-valuemax="100">
          <i class="lp-fill" id="lp-fill"></i>
          <i class="lp-knob" id="lp-knob"></i>
        </div>
        <svg class="lp-sun lp-sun-hi" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.6" fill="currentColor" stroke="none"/>
          <path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.1 5.1l1.8 1.8M17.1 17.1l1.8 1.8M18.9 5.1l-1.8 1.8M6.9 17.1l-1.8 1.8"/>
        </svg>
      </div>
      <div class="lp-row">
        <span class="lp-label">亮度跟随系统</span>
        <button class="switch" id="lp-switch" role="switch" aria-checked="false"
                aria-label="亮度跟随系统"><i></i></button>
      </div>
    </div>
  </div>
</section>

<!-- ============ 底部导航：书架 / 导入 / 列表 ============ -->
<nav id="tabbar" class="tabbar">
  <button class="tab" data-page="shelf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <!-- 小书架：框 + 两层板，板上立着几本书 -->
      <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
      <path d="M3.5 9.5h17M3.5 15h17"/>
      <path stroke-width="1.5" d="M6.8 6.4v2.2M9.8 6.4v2.2M13.8 6.4v2.2M7.3 12v2.2M12.3 12v2.2M9.5 17.4v2.2"/>
    </svg>
    <span>书架</span>
  </button>

  <button class="tab tab-add" data-page="import" aria-label="导入">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 8v8M8 12h8"/>
    </svg>
  </button>

  <button class="tab" data-page="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20"/>
      <path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/>
    </svg>
    <span>列表</span>
  </button>
</nav>

<!-- ============ 选书面板（编辑模式下往某一格加书） ============ -->
<div class="sheet" id="sheet-pick">
  <div class="sheet-mask" id="pick-mask"></div>
  <div class="sheet-inner">
    <div class="sheet-grip"></div>
    <div class="pick-head">
      <span id="pick-title">添加到这一格</span>
      <span id="pick-cap" class="pick-cap">0/6</span>
    </div>
    <div class="pick-list" id="pick-list"></div>
    <button class="pill pick-close" id="pick-close">关闭</button>
  </div>
</div>

<!-- ============ 花名册（书脊上写不下的书名都记在这儿） ============ -->
<div class="sheet" id="sheet-roster">
  <div class="sheet-mask" id="roster-mask"></div>
  <div class="sheet-inner">
    <div class="sheet-grip"></div>
    <div class="pick-head">
      <span id="roster-title">花名册</span>
      <span id="roster-count" class="pick-cap">0 本</span>
    </div>
    <p class="roster-note" id="roster-note">只记书脊上写不下、用序号标出来的书 · 点一行直接读</p>
    <div class="pick-list" id="roster-list"></div>
    <button class="pill pick-close" id="roster-close">关闭</button>
  </div>
</div>

<script>
/**
 * 手机模拟器：给假数据 + 模拟安卓环境的桩
 * 由 tools/build-phone-sim.js 注入到 design/phone-sim.html 里，
 * 位置在 db.js / shelf.js 之后、app.js 之前 —— 正好把 window.DB 换掉。
 *
 * 参数：?n=12 书库几本  ?on=5 上架几本  ?edit=1 进编辑态  ?page=list  ?dbg=1  ?act=edit
 */
(function () {
  var q = new URLSearchParams(location.search);
  var N = +(q.get('n') || 12);
  var ON = +(q.get('on') || 5);
  var CHAPS = +(q.get('chaps') || 0);      // 每本书几章，0 = 按原来那套随机
  var PARA = +(q.get('para') || 0);        // 每章几段，0 = 按原来那套随机

  var NAMES = ['三体', '活着', '百年孤独', '明朝那些事儿', '平凡的世界', '小王子',
               '围城', '白夜行', '解忧杂货店', '人类简史', '沉默的大多数', '许三观卖血记',
               '追风筝的人', '房思琪的初恋乐园', '红楼梦', '西游记', '茶馆', '边城',
               '老人与海', '月亮与六便士', '局外人', '鼠疫', '罪与罚', '卡拉马佐夫兄弟',
               '倾城之恋', '呼兰河传', '骆驼祥子', '四世同堂', '雷雨', '繁花'];
  var books = [];
  for (var i = 0; i < N; i++) {
    var chaps = CHAPS || 20 + (i * 7) % 60;
    var toc = [];
    /* ?tname=1：章名后面带上一个词（"第1章 风起"），用来验目录行
       统一成「第X章：章节名」时，标题里自带的"第X章"有没有被剥掉。 */
    var NAMED = q.get('tname') === '1';
    for (var c = 0; c < chaps; c++) {
      toc.push({
        t: '第' + (c + 1) + '章' + (NAMED ? ' ' + NAMES[(c + i) % NAMES.length] : ''),
        len: 2000 + (c * 131) % 1500
      });
    }
    books.push({
      id: 'b' + i,
      // ?long=1：给每本书加一长串后缀，用来试「书名放不下时会不会滚动」
      title: NAMES[i % NAMES.length] + (i >= NAMES.length ? ' ' + (1 + Math.floor(i / NAMES.length)) : '') +
             (q.get('long') === '1' ? '（精装典藏版 · 全本无删节 · 附番外与作者后记合集）' : ''),
      totalChars: toc.reduce(function (a, x) { return a + x.len; }, 0),
      encoding: 'utf-8',
      addedAt: Date.now() - i * 86400000,
      toc: toc
    });
  }

  // 上架：按格子顺序铺，跟「一键摆满」的规则一致
  var slots = {};
  var infos = Shelf.slotInfo();
  var k = 0, si = 0;
  while (k < Math.min(ON, N) && si < infos.length) {
    slots[infos[si].id] = [];
    var room = Math.min(infos[si].cap, Math.min(ON, N) - k);
    for (var j = 0; j < room; j++) slots[infos[si].id].push(books[k++].id);
    si++;
  }

  var progs = {};
  /* ?noread=1：一本都"没真读过"（index 和 scrollY 都是 0）—— 用来验
     「继续阅读」便签在没读过任何书时不显示、也不占位。 */
  var NO_READ = q.get('noread') === '1';
  books.forEach(function (b, i) {
    if (NO_READ) {
      progs[b.id] = { bookId: b.id, index: 0, scrollY: 0, updatedAt: Date.now() };
      return;
    }
    if (i % 3 === 0) {
      progs[b.id] = {
        bookId: b.id,
        index: Math.floor(b.toc.length * (0.2 + (i % 5) * 0.15)),
        scrollY: 0,
        updatedAt: Date.now()
      };
    }
  });

  function later(v) { return Promise.resolve(v); }

  window.DB = {
    // 真库里是 put（upsert），别写成 unshift 追加 —— 否则补序号那步会把书翻倍
    addBook: function (b) {
      var i = -1;
      for (var k = 0; k < books.length; k++) if (books[k].id === b.id) { i = k; break; }
      if (i >= 0) books[i] = Object.assign({}, books[i], b);
      else books.unshift(b);
      return later(true);
    },
    getBook: function (id) {
      return later(books.filter(function (x) { return x.id === id; })[0] || null);
    },
    listBooks: function () { return later(books.slice()); },
    delBook: function (id) {
      books = books.filter(function (x) { return x.id !== id; });
      Object.keys(slots).forEach(function (kk) {
        slots[kk] = slots[kk].filter(function (x) { return x !== id; });
      });
      return later(true);
    },
    putChapters: function () { return later(true); },
    getChapter: function (bookId, idx) {
      // ?para=N 造一章超长正文，用来试「一章几万段会不会卡死」
      var n = PARA || 60;
      var out = [];
      for (var i = 0; i < n; i++) {
        out.push('第 ' + (i + 1) + ' 段。这是一段占位正文，用来量渲染开销。'
          + '砚读把整本小说切成章节，读的时候只画当前这一章，'
          + '所以一章多大直接决定了打开这本书要多久。'.repeat(2));
      }
      return later(out.join('\n'));
    },
    setProgress: function (p) { progs[p.bookId] = p; return later(true); },
    getProgress: function (id) { return later(progs[id] || null); },
    /* 真库这个接口是批量读进度（一本一个事务太贵）。
       桩必须跟着有 —— 少了它 withProgress 会抛 TypeError，
       列表渲染静默失败，表现就是"列表一片空白"，很难查。 */
    allProgress: function () { return later(JSON.parse(JSON.stringify(progs))); },
    getSlots: function () { return later(JSON.parse(JSON.stringify(slots))); },
    setSlot: function (id, items) { slots[id] = items.slice(); return later(true); },
    unshelf: function (bid) {
      Object.keys(slots).forEach(function (kk) {
        slots[kk] = slots[kk].filter(function (x) { return x !== bid; });
      });
      return later(true);
    },
    clearSlots: function () { slots = {}; return later(true); },
    setSetting: function () { return later(true); },
    getSettings: function () { return later({}); }
  };

  /* ?legacy=1：把书脊还原成 2026-09-18 改版前的样子，用来出"改前"对照图。
     三件事是当时的实际状态：平涂（craft:false）、整架书同一个宽度（minW=maxW）、
     老的那套绿（含最深 #1F4A33 和最浅 #6A9E7C）。放在 stub 里是因为它在 app.js 之前跑，
     配置要在首次渲染前生效。 */
  if (q.get('legacy') === '1') {
    Shelf.configure({
      book: { craft: false, minW: 15.4, maxW: 15.4, lean: 0 },
      greens: ['#2E6B4A', '#3D7A57', '#245539', '#4E8A63', '#1F4A33', '#5C9470', '#376B52', '#6A9E7C']
    });
  }

  window.__SIM = { edit: q.get('edit') === '1', page: q.get('page') || 'shelf' };
})();

</script>
<script src="../www/js/app.js"></script>
<script>
/**
 * 手机模拟器的驱动脚本（由 tools/build-phone-sim.js 注入，跑在 app.js 之后）
 *   ?edit=1   进编辑态
 *   ?page=list 切到列表页
 *   ?dbg=1    把量到的尺寸塞进 <pre id="DBGOUT">，配合 msedge --dump-dom 读
 *   ?act=edit 脚本化点一遍「编辑 → 点格子 → 加一本」，结果塞进 <pre id="ACTOUT">
 *   ?act=roll 连续卷轴的八项验收（必须配 cdp-run.js 跑，见 README 3.1）
 *
 * headless 浏览器上跑不了真手指，所以用这个来验交互有没有断。
 */
(function () {
  var q = new URLSearchParams(location.search);
  function $(s) { return document.querySelector(s); }

  /* ?repro=page|ar|all：故意把新特性关掉，用来复现「老 WebView 上会变成什么样」。
     page = 装作 inset 不生效（页面收缩到内容大小、浮层跑到视口外）
     ar   = 装作 aspect-ratio 不生效（架子高度塌成 0，靠 JS 兜底救回来）
     all  = 两个都关（就是她那台机器的状态） */
  var repro = q.get('repro');
  if (repro) {
    var css = '';
    if (repro === 'page' || repro === 'all') {
      css += '.page,.sheet,.drawer{top:auto;right:auto;bottom:auto;left:auto;width:auto;height:auto}';
    }
    if (repro === 'ar' || repro === 'all') {
      css += '.shelf-canvas{aspect-ratio:auto;height:0}';
    }
    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
  }

  /* ?narrow=1：把书名那一列捏窄到 110px，用来在宽窗口里也能试出「放不下 → 滚动」 */
  if (q.get('narrow') === '1') {
    var st2 = document.createElement('style');
    st2.textContent = '#roster-list .pick-name, #list-body .bk-name { max-width: 110px; }';
    document.head.appendChild(st2);
  }

  function measure() {
    var r = function (el) {
      if (!el) return null;
      var b = el.getBoundingClientRect();
      return [Math.round(b.left), Math.round(b.top), Math.round(b.width), Math.round(b.height)];
    };
    return {
      vw: window.innerWidth, vh: window.innerHeight, dpr: window.devicePixelRatio,
      docW: document.documentElement.scrollWidth, docH: document.documentElement.scrollHeight,
      pageShelf: r($('#page-shelf')),
      head: r($('.shelf-head')),
      stage: r($('.shelf-stage')),
      canvas: r($('.shelf-canvas')),
      svg: r($('.shelf-canvas svg')),
      tip: r($('#shelf-tip')),
      editbar: r($('#edit-bar')),
      tabbar: r($('#tabbar')),
      addSvg: r($('.tab-add svg')),
      tabs: [].map.call(document.querySelectorAll('.tab'), function (t) {
        return t.getAttribute('data-page') + ':' + JSON.stringify(r(t));
      })
    };
  }

  function dump(id, body) {
    var pre = document.getElementById(id) || document.createElement('pre');
    pre.id = id;
    pre.textContent = id + 'START' + JSON.stringify(body, null, 1) + id + 'END';
    if (!pre.parentNode) document.body.appendChild(pre);
  }

  setTimeout(function () {
    if (q.get('edit') === '1') $('#btn-edit').click();
    if (q.get('roster') === '1') $('#btn-roster').click();
    if (q.get('page') === 'list') $('.tab[data-page="list"]').click();

    if (q.get('dbg') === '1') {
      setTimeout(function () { dump('DBGOUT', measure()); }, 400);
    }

    if (q.get('act') === 'fill') {
      var log2 = [];
      setTimeout(function () {
        $('#btn-edit').click();
        setTimeout(function () {
          $('#btn-fill').click();
          setTimeout(function () {
            window.DB.getSlots().then(function (s) {
              var total = 0;
              log2.push({ 摆位: s, 上架总数: Object.keys(s).reduce(function (a, k) { return a + s[k].length; }, 0) });
              log2.push({ 架子上的书: $('#shelf-stage').querySelectorAll('.bk').length,
                          提示: $('#shelf-tip').textContent, 副标题: $('#shelf-sub').textContent });
              dump('ACTOUT', log2);
            });
          }, 500);
        }, 400);
      }, 400);
    }

    if (q.get('act') === 'read') {
      // 量「从列表点一本书 → 阅读页真的能看」这一路要多久、有没有卡住
      var log3 = [];
      var errs = [];
      window.onerror = function (msg, src, line) { errs.push(msg + ' @' + line); };
      setTimeout(function () {
        $('.tab[data-page="list"]').click();
        setTimeout(function () {
          var row = document.querySelector('#list-body .bk-row');
          if (!row) { log3.push('列表里没有书行，测试做不了'); dump('ACTOUT', log3); return; }
          var t0 = performance.now();
          row.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
          var poll = setInterval(function () {
            var loading = $('#loading').classList.contains('on');
            var readerOn = $('#page-reader').classList.contains('active');
            if (!loading && readerOn) {
              clearInterval(poll);
              var ms = Math.round(performance.now() - t0);
              log3.push({
                打开耗时ms: ms,
                阅读页显示: true,
                残留loading遮罩: false,
                章节标题: $('.chapter-block .chapter-title').textContent,
                页眉: $('#reader-title').textContent,
                正文段数: $('#chapter-content p').length,
                目录条数: $('#toc-list').children.length,
                阅读区可滚动: (function () {
                  var el = $('#reader-body');
                  return { 高: el.clientHeight, 内容高: el.scrollHeight, 可滚: el.scrollHeight > el.clientHeight + 2 };
                })(),
                /* ↓ 2026-09-18 那轮改完加的量：上下栏是不是真的浮起来了、
                   字号/字体有没有落到 <p>、主题是不是只挂在阅读页 */
                上下栏: (function () {
                  function R(sel) {
                    var e = $(sel); if (!e) return 'n/a';
                    var b = e.getBoundingClientRect();
                    return [b.top, b.height].map(Math.round).join('/');
                  }
                  return {
                    head位置: R('.reader-head') + ' pos=' + getComputedStyle($('.reader-head')).position,
                    foot位置: R('.reader-foot') + ' pos=' + getComputedStyle($('.reader-foot')).position,
                    body: R('#reader-body'),
                    bodyPadding: getComputedStyle($('#reader-body')).paddingTop + ' / ' +
                                 getComputedStyle($('#reader-body')).paddingBottom
                  };
                })(),
                正文字号: (function () {
                  var p = $('#chapter-content p');
                  return p ? getComputedStyle(p).fontSize : '没有正文';
                })(),
                正文字体: (function () {
                  var p = $('#chapter-content p');
                  return p ? getComputedStyle(p).fontFamily.slice(0, 40) : '没有正文';
                })(),
                主题: {
                  html: document.documentElement.getAttribute('data-theme'),
                  reader: $('#page-reader').getAttribute('data-theme'),
                  书架背景: getComputedStyle($('#page-shelf')).backgroundColor,
                  阅读页背景: getComputedStyle($('#page-reader')).backgroundColor,
                  亮度遮罩: getComputedStyle($('#dim')).opacity
                },
                底部导航是否收起了: $('#tabbar').style.display === 'none',
                页面报错: errs
              });
              dump('ACTOUT', log3);

              /* 改一遍设置，看有没有真的落到正文上：
                 A+ 两下（18→22）、切成宋体、切黑主题 */
              $('#fs-plus').click();
              $('#fs-plus').click();
              $('#font-pick .pill[data-font="serif"]').click();
              $('#theme-pick .dot[data-theme="dark"]').click();
              var p2 = $('#chapter-content p');
              log3.push({
                改设置后: {
                  字号: p2 ? getComputedStyle(p2).fontSize : 'n/a',
                  字体: p2 ? getComputedStyle(p2).fontFamily.slice(0, 40) : 'n/a',
                  字距: p2 ? getComputedStyle(p2).letterSpacing : 'n/a',
                  标题字体: getComputedStyle($('.chapter-block .chapter-title')).fontFamily.slice(0, 40),
                  阅读页背景: getComputedStyle($('#page-reader')).backgroundColor,
                  书架背景: getComputedStyle($('#page-shelf')).backgroundColor
                }
              });
              dump('ACTOUT', log3);
              // 再验一下「滑到底会自动补下一批段落」
              var rb = $('#reader-body');
              var before = (window.__reader() || { blocks: [] }).blocks.length;
              rb.scrollTop = rb.scrollHeight;
              rb.dispatchEvent(new Event('scroll'));
              setTimeout(function () {
                log3.push({
                /* 连续卷轴之后，"滑到底会追加段落"这个判据作废了：
                   段是按需要补的，短章一开场就画完了。该验的是
                   「滑到底之后下一章被接上来了没有」。 */
                滑到底前挂着几章: before,
                滑到底后挂着几章: (window.__reader() || { blocks: [] }).blocks.length,
                /* 现在打开书就会把前后邻居预挂上（ensureNeighbors），
                   "滑到底又多了几章"不再是判据 —— 改成"至少挂着 2 章"。 */
                挂着至少两章: (window.__reader() || { blocks: [] }).blocks.length >= 2,   // 打开时就预挂了前后邻居
                内容高: rb.scrollHeight
                });
                dump('ACTOUT', log3);
              }, 250);
            }
          }, 60);
          setTimeout(function () {           // 8 秒还没好，就把卡住的样子记下来
            clearInterval(poll);
            if (log3.length) return;
            log3.push({
              打开耗时ms: '超过 8000 仍未完成',
              阅读页显示: $('#page-reader').classList.contains('active'),
              残留loading遮罩: $('#loading').classList.contains('on'),
              正文段数: $('#chapter-content p').length,
              目录条数: $('#toc-list').children.length,
              页面报错: errs
            });
            dump('ACTOUT', log3);
          }, 8000);
        }, 400);
      }, 400);
    }

    if (q.get('act') === 'dbg') {
      // 长按左上角「砚读」应该弹出诊断面板
      var h1 = document.querySelector('#page-shelf h1');
      h1.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      setTimeout(function () {
        var el = document.getElementById('dbg');
        dump('ACTOUT', {
          面板出现了: !!el && el.style.display === 'block',
          内容: el ? el.textContent.split('\n') : null
        });
      }, 1100);
    }

    if (q.get('act') === 'roster') {
      // 花名册：架子上有需要编号的书时才出现按钮；点开要能对上号
      var log4 = [];
      function out4() { dump('ACTOUT', log4); }
      setTimeout(function () {
        var btn = $('#btn-roster');
        log4.push({
          按钮存在: !!btn,
          按钮可见: btn && btn.style.display !== 'none',
          按钮文字: btn ? btn.textContent : null,
          书脊上的序号: [].map.call(document.querySelectorAll('#shelf-stage .bk'), function (g) {
            return g.getAttribute('data-no') || g.getAttribute('data-seq');
          })
        });
        out4();
        if (!btn) return;
        btn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
        setTimeout(function () {
          // 花名册的行复用 .pick-row（加 .plain 表示这本没编号），别找 .roster-row
          var rows = $('#roster-list').querySelectorAll('.pick-row');
          log4.push({
            面板打开: $('#sheet-roster').classList.contains('open'),
            标题: $('#roster-title').textContent,
            计数: $('#roster-count').textContent,
            说明: $('#roster-note').textContent,
            行数: rows.length,
            滚动书名: $('#roster-list').querySelectorAll('.pick-name.roll').length + '/' +
                      $('#roster-list').querySelectorAll('.pick-name').length,
            首行量宽: (function () {
              var e = $('#roster-list .pick-name');
              if (!e || !e.firstChild) return 'n/a';
              return 'box=' + e.clientWidth + ' 内=' + e.firstChild.offsetWidth +
                     ' 超=' + (e.firstChild.offsetWidth - e.clientWidth);
            })(),
            前三行: [].slice.call(rows, 0, 3).map(function (r) { return r.textContent.replace(/\s+/g, ' ').trim(); })
          });
          out4();
          // 点一行应该直接进阅读器
          if (rows.length) {
            rows[0].dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
            setTimeout(function () {
              log4.push({
                阅读页打开: $('#page-reader').classList.contains('active'),
                章节标题: $('.chapter-block .chapter-title').textContent,
                残留遮罩: $('#loading').classList.contains('on')
              });
              out4();
            }, 600);
          }
        }, 500);
      }, 400);
    }

    if (q.get('act') === 'edit') {
      var log = [];
      function click(el, label) {
        if (!el) { log.push(label + ' → 元素不存在'); return; }
        try {
          el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
        } catch (e) { log.push(label + ' → 抛错 ' + e.message); }
      }
      function snap(label) {
        var stage = $('#shelf-stage');
        try {
        log.push({
          step: label,
          slotg: stage.querySelectorAll('.slotg').length,
          slothit: stage.querySelectorAll('.slothit').length,
          slotbox: stage.querySelectorAll('.slotbox').length,
          badge: stage.querySelectorAll('.slotbadge').length,
          books: stage.querySelectorAll('.bk').length,
          editBtnText: $('#btn-edit').textContent,
          editBarOn: $('#edit-bar').classList.contains('on'),
          pickOpen: $('#sheet-pick').classList.contains('open'),
          pickRows: $('#pick-list').querySelectorAll('.pick-row').length,
          pickTitle: $('#pick-title').textContent,
          pickCap: $('#pick-cap').textContent,

   /* ?act=drag：**两条滑动条（底栏章节进度条 + 目录胶囊滚动条）的验收**。
      她报的是"滑动卡顿 + 会卡死"，所以这里盯两件事：

        ① 拖动过程中不许每个事件都去读几何（那会逼浏览器反复排版正文/目录）
        ② **pointerup 丢了也要能自愈** —— 3 秒没事件就当松手，
           否则 dragging 永远 true，之后手指随便动一下都在"拖"（就是她说的卡死）

      跑法：node tools/cdp-run.js "file:///.../phone-sim.html?act=drag&chaps=40&para=25" 30000 */
   if (q.get('act') === 'drag') {
     var logD = [], errD = [];
     window.onerror = function (msg, src, line) { errD.push(msg + ' @' + line); };

     function pe(type, x, y) {
       return new PointerEvent(type, { clientX: x, clientY: y, bubbles: true, pointerId: 7 });
     }
     function r(node) { return node.getBoundingClientRect(); }

     /* 拖一串：从 from 到 to，分 n 步 */
     function drag(handle, from, to, axis, steps, cb) {
       var cur = from, frames = 0, running = true;
       /* 拖动期间数帧：卡不卡，看这个数比看耗时准（耗时是 setTimeout 的节奏定的） */
       (function f() { if (!running) return; frames++; requestAnimationFrame(f); })();
       handle.dispatchEvent(pe('pointerdown', axis === 'y' ? 0 : cur, axis === 'y' ? cur : 0));
       var k = 0, t0 = Date.now();
       (function tick() {
         cur = from + (to - from) * (++k / steps);
         document.dispatchEvent(pe('pointermove', axis === 'y' ? 0 : cur, axis === 'y' ? cur : 0));
         if (k < steps) { setTimeout(tick, 16); return; }
         running = false;
         cb(Date.now() - t0, frames);
       })();
     }

     function testSeek(cb) {
       var bar = document.getElementById('fc-bar'), dot = document.getElementById('fc-dot');
       var rb = r(bar);
       var before = window.__reader().index;
       var dotBefore = dot.style.left;
       var y = rb.top + rb.height / 2;
       drag(bar, rb.left + rb.width * 0.1, rb.left + rb.width * 0.8, 'x', 20, function (ms, frames) {
         var dotMid = dot.style.left;
         document.dispatchEvent(pe('pointerup', rb.left + rb.width * 0.8, y));
         setTimeout(function () {
           logD.push({
             步骤: '底栏进度条：拖一大段',
             拖动耗时ms: ms,
             拖动期间帧数: frames,
             折算帧率: Math.round(frames / (ms / 1000)) + 'fps',
             圆点_前: dotBefore, 圆点_拖到一半: dotMid,
             章_前: before + 1, 章_后: window.__reader().index + 1,
             真的跳章了: window.__reader().index !== before
           });
           /* ★ 卡死自愈：只按下 + 拖，**故意不发 pointerup** */
           var x2 = rb.left + rb.width * 0.2;
           bar.dispatchEvent(pe('pointerdown', x2, y));
           document.dispatchEvent(pe('pointermove', x2 + 40, y));
            setTimeout(function () {
              var afterDown = dot.style.left;   /* 等 rAF 落地再读，别读到上一次的旧值 */
              setTimeout(function () {
                /* 三秒多没事件了，dragify 应该已经自己收尾 */
                document.dispatchEvent(pe("pointermove", rb.left + rb.width * 0.95, y));
                setTimeout(function () {
                  logD.push({
                    步骤: "底栏进度条：丢掉 pointerup 之后",
                    按下后圆点: afterDown,
                    三秒后乱动手指_圆点: dot.style.left,
                    自愈了吗: Math.abs(parseFloat(dot.style.left) - parseFloat(afterDown)) < 3,
                    说明: "圆点没跟着手指跑到 95% = 不再被拖着走（不再卡死）"
                  });
                  cb();
                }, 150);
              }, 3300);
            }, 150);
          }, 600);
       });
     }

     function testToc(cb) {
       document.getElementById('btn-toc').click();
       setTimeout(function () {
         var list = document.getElementById('toc-list');
         var th = document.getElementById('sb-thumb');
         var rt = r(th);
         var topBefore = list.scrollTop;
         var y0 = rt.top + rt.height / 2;
         drag(th, y0, y0 + 180, 'y', 20, function (ms, frames) {
           var mid = list.scrollTop;
           document.dispatchEvent(pe('pointerup', 0, y0 + 180));
           setTimeout(function () {
             logD.push({
               步骤: '目录胶囊滚动条：拖一大段',
               拖动耗时ms: ms,
               拖动期间帧数: frames,
               折算帧率: Math.round(frames / (ms / 1000)) + 'fps',
               目录滚动_前: topBefore, 拖之后: mid,
               滚动条动了吗: mid !== topBefore,
               滑块top: th.style.top
             });
             /* 同样的自愈测试 */
             th.dispatchEvent(pe('pointerdown', 0, y0));
             document.dispatchEvent(pe('pointermove', 0, y0 + 30));
             setTimeout(function () {
               var afterDown = list.scrollTop;   /* 同样等 rAF 落地再读 */
               setTimeout(function () {
                 document.dispatchEvent(pe('pointermove', 0, y0 + 400));
                 setTimeout(function () {
                   logD.push({
                     步骤: '目录滚动条：丢掉 pointerup 之后',
                     按下后滚动位置: afterDown,
                     三秒后乱动手指_滚动位置: list.scrollTop,
                     自愈了吗: Math.abs(list.scrollTop - afterDown) < 30,
                     说明: '没被手指拖着跑一大段 = 不再卡死'
                   });
                   document.getElementById('toc-mask').click();
                   cb();
                 }, 150);
               }, 3300);
             }, 150);
           }, 300);
         });
       }, 700);
     }

     setTimeout(function () {
       document.querySelector('.tab[data-page="list"]').click();
       setTimeout(function () {
         var tries = 0;
         (function go() {
           var rs = document.querySelectorAll('#list-body .bk-row');
           if (!rs.length && ++tries < 20) { setTimeout(go, 250); return; }
           (rs[1] || rs[0]).dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
           setTimeout(function () {
             testSeek(function () {
               testToc(function () {
                 logD.push({ 页面报错: errD });
                 dump('ACTOUT', logD);
               });
             });
           }, 1600);
         })();
       }, 700);
     }, 700);
   }

   /* ?act=shot：给截图用。三种画面：
       ?shot=continue  书架页的「继续阅读」便签（默认就能出，桩里有读过进度的书）
       ?shot=read      阅读页滑到章末，把章末卡片露出来
       ?shot=set       设置面板（看「章末自动翻页」那个开关）
     静态截图走旧 headless（虚拟时间下 rAF 不跑，正好不会自动翻章，能定格） */
  if (q.get('act') === 'shot') {
    var shot = q.get('shot') || 'read';
    if (shot === 'continue') {
      var logS = [];
      setTimeout(function () {
        var c = $('#btn-continue');
        var rc = c.getBoundingClientRect();
        var rsh = document.querySelector('.shelf-canvas').getBoundingClientRect();
        logS.push({
          显示: getComputedStyle(c).display,
          书名: $('#cc-name').textContent,
          副标题: $('#cc-sub').textContent,
          竖条色: getComputedStyle($('#cc-spine')).backgroundColor,
          进度线宽: $('#cc-bar').style.width,
          卡片: [Math.round(rc.left), Math.round(rc.top), Math.round(rc.width), Math.round(rc.height)],
          架子: [Math.round(rsh.left), Math.round(rsh.top), Math.round(rsh.width), Math.round(rsh.height)],
          左右留白: Math.round(rc.left) + ' / ' + Math.round(window.innerWidth - rc.right),
          架子是否还在: !!document.querySelector('.shelf-canvas svg')
        });
        dump('ACTOUT', logS);
      }, 1500);
    } else {
      setTimeout(function () {
        document.querySelector('.tab[data-page="list"]').click();
        setTimeout(function () {
          var row = document.querySelector('#list-body .bk-row');
          if (row) row.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
          setTimeout(function () {
            if (shot === 'set') { document.getElementById('btn-set').click(); return; }
            /* ?shot=seam：把「上一章最后几行 + 下一章的标题」这条接缝摆在屏幕中间。
               这就是这次要的效果 —— 整本书读起来像一条很长的书页，中间没有翻页。 */
            if (shot === 'seam') {
              setTimeout(function () {
                var el2 = document.getElementById('reader-body');
                var bs = document.querySelectorAll('.chapter-block');
                if (bs.length < 2) { dump('ACTOUT', [{ 错误: '只挂了 ' + bs.length + ' 章，接缝出不来' }]); return; }
                var top = bs[1].getBoundingClientRect().top - el2.getBoundingClientRect().top + el2.scrollTop;
                el2.scrollTop = Math.max(0, top - el2.clientHeight * 0.42);
                el2.dispatchEvent(new Event('scroll'));
                setTimeout(function () {
                  dump('ACTOUT', [{
                    挂着几章: (window.__reader() || { blocks: [] }).blocks.map(function (b) { return b.idx; }),
                    接缝上下: [bs[0].textContent.slice(-16), bs[1].textContent.slice(0, 16)]
                  }]);
                }, 400);
              }, 1200);
              return;
            }
            /* ?shot=paged：摆好**分页模式**的画面（底栏显示"第 N / 共 M 页"、
               两个键变成上一页/下一页），给截图用。 */
            /* ?shot=fx&mode=cover|sim：**动画中途**的截图。
               做法：把"点下一章"固定在 2200ms，然后用 cdp-run 的等待时间
               （WAIT=2380）去卡那一瞬间 —— 覆盖 0.30s / 仿真 0.42s 的动画，
               拍到时正好在中间，能看出"新的一屏正在盖上来 / 立起来"。 */
            /* ?shot=auto：自动翻页开着、两个面板都收掉、只留右下角小胶囊 */
            if (shot === 'auto') {
              setTimeout(function () {
                document.getElementById('btn-set').click();
                setTimeout(function () {
                  document.getElementById('rs-auto').click();
                  /* ⚠️ 自动翻页一开始滚，上下两条栏就会自动收起（`top<24` 才摊开），
                     而那枚小胶囊是跟着两条栏一起藏/现的 —— 不把它按在页首，
                     截图就永远只能拍到"胶囊已经被收起来了"。
                     这里每 120ms 把它拨回页首并手动发一次 scroll，栏就一直摊开。 */
                  var pinN = 0;
                  var pin = setInterval(function () {
                    var e = document.getElementById('reader-body');
                    /* ⚠️ 别一直写 0：滚动回调里 `|dy| < 6 就当抖动忽略`，
                       位移太小的话「回到开头就摊开栏」那条永远轮不到。交替 0/10 才行。 */
                    e.scrollTop = (pinN++ % 2) ? 10 : 0;
                    e.dispatchEvent(new Event('scroll'));
                  }, 120);
                  /* ⚠️ 这个 pin 一直不撤：截图是 cdp-run 在等待结束之后才拍的，
                     中途撤掉的话，等它拍的时候自动翻页早把栏收起来了。 */
                  setTimeout(function () {
                    var p = document.getElementById('ap-pill');
                    var r = p.getBoundingClientRect();
                    var foot = document.getElementById('reader-foot').getBoundingClientRect();
                    dump('ACTOUT', [{
                      设置面板收了: !document.getElementById('sheet-readset').classList.contains('open'),
                      速度面板收了: !document.getElementById('sheet-speed').classList.contains('open'),
                      胶囊可见: p.classList.contains('on'),
                      胶囊位置: Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height),
                      阅读页: (function () {
                        var q = document.getElementById('page-reader').getBoundingClientRect();
                        return Math.round(q.left) + '..' + Math.round(q.right) + ' 高' + Math.round(q.height) + ' 视口宽' + window.innerWidth;
                      })(),
                      压到底栏了吗: r.bottom > foot.top,
                      上下栏摊开了吗: !document.getElementById('page-reader').classList.contains('bars-off'),
                      胶囊文字: p.textContent
                    }]);
                  }, 900);
                }, 600);
              }, 900);
              return;
            }
            /* ?shot=speed：摆好自动翻页的速度面板（配色跟亮度面板同一套） */
            if (shot === 'speed') {
              setTimeout(function () {
                document.getElementById('btn-set').click();
                setTimeout(function () {
                  document.getElementById('rs-auto').click();
                  document.getElementById('sheet-readset').classList.remove('open');
                  setTimeout(function () {
                    document.getElementById('ap-pill').click();   // 面板现在是点了胶囊才出来
                  }, 300);
                  setTimeout(function () {
                    dump('ACTOUT', [{
                      速度面板开着: document.getElementById('sheet-speed').classList.contains('open'),
                      面板底色: getComputedStyle(document.querySelector('.sp-panel')).backgroundColor,
                      字色: getComputedStyle(document.getElementById('sp-val')).color,
                      字体: getComputedStyle(document.getElementById('sp-val')).fontFamily.split(',')[0],
                      速度值: document.getElementById('sp-val').textContent,
                      退出按钮: document.getElementById('sp-exit').textContent
                    }]);
                  }, 700);
                }, 600);
              }, 900);
              return;
            }
            /* ?shot=toc：摆好左侧目录面板让截图（书籍信息 + 列表 + 胶囊滚动条） */
            if (shot === 'toc') {
              setTimeout(function () {
                document.getElementById('btn-toc').click();
                setTimeout(function () {
                  var inner = document.querySelector('#drawer-toc .drawer-inner').getBoundingClientRect();
                  dump('ACTOUT', [{
                    面板开着: document.getElementById('drawer-toc').classList.contains('open'),
                    宽占屏: Math.round(inner.width / window.innerWidth * 100) + '%',
                    书名: document.getElementById('toc-title').textContent,
                    副信息: document.getElementById('toc-meta').textContent,
                    当前章: (document.querySelector('#toc-list .toc-item.cur') || {}).textContent,
                    滚动条: !document.getElementById('toc-sbar').classList.contains('hide')
                  }]);
                }, 700);
              }, 900);
              return;
            }
            /* ?shot=setpanel：摆好阅读设置面板让截图（字号 / 背景 / 翻页 / 底部分隔行） */
            if (shot === 'setpanel') {
              setTimeout(function () {
                document.getElementById('btn-set').click();
                setTimeout(function () {
                  dump('ACTOUT', [{
                    面板开着: document.getElementById('sheet-readset').classList.contains('open'),
                    字号: document.getElementById('rs-fs-val').textContent,
                    字体: document.getElementById('rs-font-name').textContent,
                    选中背景: (document.querySelector('#rs-theme .rs-dot.on') || { getAttribute: function () { return '无'; } }).getAttribute('data-theme'),
          /* 「翻页方式」已撤掉，这里不再断言它的选中态 */
                    自动翻页: document.getElementById('rs-auto').textContent,
                    面板高: Math.round(document.querySelector('.rs-panel').getBoundingClientRect().height)
                  }]);
                }, 600);
              }, 900);
              return;
            }
            /* ?shot=light：摆好亮度面板让截图（两行式：滑条 + 跟随系统开关） */
            if (shot === 'light') {
              setTimeout(function () {
                document.getElementById('btn-light').click();
                setTimeout(function () {
                  dump('ACTOUT', [{
                    面板开着: document.getElementById('sheet-light').classList.contains('open'),
                    亮度: document.getElementById('brightness').value,
                    已激活轨道: document.getElementById('lp-fill').style.width,
                    圆滑块: document.getElementById('lp-knob').style.left,
                    开关: document.getElementById('lp-switch').classList.contains('on') ? '开' : '关',
                    面板高: Math.round(document.querySelector('.light-panel').getBoundingClientRect().height)
                  }]);
                }, 500);
              }, 900);
              return;
            }
            /* ?shot=foot / night：摆好新 UI 让截图（两条栏都在，不滚到底） */
            if (shot === 'foot' || shot === 'night') {
              setTimeout(function () {
                if (shot === 'night') document.getElementById('btn-night').click();
                setTimeout(function () {
                  dump('ACTOUT', [{
                    画面: shot,
                    主题: document.documentElement.getAttribute('data-theme'),
                    章节: document.getElementById('fc-title').textContent,
                    顶栏: document.getElementById('btn-back').textContent.trim() + ' / ' + document.getElementById('btn-more').textContent.trim(),
                    功能键: [].map.call(document.querySelectorAll('.fm-btn'), function (b) { return b.textContent.trim(); }).join(' '),
                    底栏高: Math.round(document.getElementById('reader-foot').getBoundingClientRect().height)
                  }]);
                }, 600);
              }, 900);
              return;
            }
            document.querySelector('#auto-pick .pill[data-auto="0"]').click();   // 别让它在截图时翻走
            var el = document.getElementById('reader-body');
            var n = 0;
            (function push2() {
              el.scrollTop = el.scrollHeight;
              el.dispatchEvent(new Event('scroll'));
              if (++n < 6) setTimeout(push2, 120);
            })();
          }, 900);
        }, 700);
      }, 700);
    }
  }

  /* ?act=continue：继续阅读便签的完整验收。
     验四件事：①有读过进度时显示、内容对 ②点它能进那本书
     ③一本都没读过时不显示（且不占位） ④编辑架子时让位 */
  if (q.get('act') === 'continue') {
    var log5 = [], errs5 = [];
    window.onerror = function (msg, src, line) { errs5.push(msg + ' @' + line); };
    var card = document.getElementById('btn-continue');
    function snap5(tag) {
      var on = getComputedStyle(card).display !== 'none';
      var rc = card.getBoundingClientRect();
      var rsh = document.querySelector('.shelf-canvas').getBoundingClientRect();
      var stage = document.querySelector('.shelf-stage');
      log5.push({
         步骤: tag,
         可见: on,
        书名: on ? document.getElementById('cc-name').textContent : '',
        副标题: on ? document.getElementById('cc-sub').textContent : '',
        进宽度: on ? Math.round(rc.width) : 0,
        左右留白: on ? Math.round(rc.left) + '/' + Math.round(window.innerWidth - rc.right) : '',
        架子宽度: Math.round(rsh.width),
        /* 不显示时卡片必须真的不占位：架子顶边应该跟空出卡片时一样 */
        卡片占位高: Math.round(rc.height),
        架子上留白: Math.round(rsh.top - document.querySelector('.shelf-head').getBoundingClientRect().bottom),
        书架页: document.getElementById('page-shelf').classList.contains('active')
      });
    }
    function wait5(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    wait5(900).then(function () {
      snap5('进 App（桩里第 1、4、7 本有进度）');
      return window.DB.getSlots().then(function (sl) {
        log5.push({ 架上: Object.keys(sl).length + ' 格',
                    桩里有进度的: [0, 3, 6].map(function (i) { return 'b' + i; }) });
      });
    }).then(function () {
      card.click();                                   // 点继续阅读 → 应该进那本书
      return wait5(1400);
    }).then(function () {
      log5.push({ 步: '点便签之后', 到了阅读页: document.getElementById('page-reader').classList.contains('active'),
                  章节标题: document.querySelector('.chapter-block .chapter-title').textContent,
                  页眉: document.getElementById('reader-title').textContent });
      document.getElementById('btn-back').click();
      return wait5(900);
    }).then(function () {
      snap5('返回书架');
      var e = document.getElementById('btn-edit');
      e.click();                                      // 编辑态应该收起来
      return wait5(900);
    }).then(function () {
      snap5('编辑态');
      document.getElementById('btn-edit').click();
      return wait5(900);
    }).then(function () {
      snap5('退出编辑态');
      log5.push({ 错误: errs5 });
      dump('ACTOUT', log5);
    });
  }

  /* ?act=io：数一数一次列表渲染到底开了多少次数据库事务。
     进度以前是一本一本地查（每本一个事务），改批量后应该跟书的本数无关。 */
  if (q.get('act') === 'io') {
    setTimeout(function () {
      var names = ['listBooks', 'getSlots', 'getProgress', 'allProgress', 'setProgress'];
      var cnt = {};
      names.forEach(function (k) {
        cnt[k] = 0;
        var f = window.DB[k];
        window.DB[k] = function () { cnt[k]++; return f.apply(window.DB, arguments); };
      });
      var log = [];
      function snap(tag) {
        var o = { 阶段: tag };
        names.forEach(function (k) { o[k] = cnt[k]; });
        log.push(o);
      }
      snap('计数清零');
      names.forEach(function (k) { cnt[k] = 0; });

      var listTab = document.querySelector('.tab[data-page=\'list\']');
      listTab.click();
      setTimeout(function () {
        snap('切到列表页');
        var rosterBtn = document.getElementById('btn-roster');
        if (rosterBtn) rosterBtn.click();
        setTimeout(function () {
          snap('开花名册');
          var bodyEl = document.getElementById('list-body');
          var rows = document.querySelectorAll('#list-body .bk-row').length;
          log.push({ 调试: { 全书bk行数: document.querySelectorAll('.bk-row').length, listBody长度: bodyEl ? bodyEl.innerHTML.length : -1, 前200: bodyEl ? bodyEl.innerHTML.slice(0, 200) : '' } });
          log.push({ 列表行数: rows, 结论: cnt.getProgress === 0 ? '进度已走批量' : '还有 ' + cnt.getProgress + ' 次单本查询' });
          dump('ACTOUT', log);
        }, 600);
      }, 800);
    }, 1200);
  }

  }, 80);

})();

</script>

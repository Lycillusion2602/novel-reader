<!DOCTYPE html>
<!-- 量「导入」按钮：绿圆的中心 和 白色加号的中心 到底差多少像素。
     不算法不信 CSS，直接数像素 —— 屏幕最深089，听说eye才算。
     用法：_pxcircle.html?src=<图片绝对路径>
     跑的时候必须加 --allow-file-access-from-files，否则 file:// 的图会污染 canvas。 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>circle probe</title></head>
<body>
<pre id="PIXOUT">loading</pre>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get('src');
  var img = new Image();
  img.onload = function () {
    var W = img.naturalWidth, H = img.naturalHeight;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    var out = { size: [W, H] };
    try {
      var d = g.getImageData(0, 0, W, H).data;
      function rgb(x, y) {
        var i = (y * W + x) * 4;
        return [d[i], d[i + 1], d[i + 2]];
      }
      // 扫描区：横向中央 ±70（避开左右两个页签的绿字），纵向底部 130px
      var X0 = Math.max(0, Math.round(W / 2) - 70), X1 = Math.min(W - 1, Math.round(W / 2) + 70);
      var Y0 = Math.max(0, H - 130), Y1 = H - 1;

      var GREEN = [46, 107, 74];
      function near(p, t, tol) {
        return Math.abs(p[0] - t[0]) <= tol && Math.abs(p[1] - t[1]) <= tol && Math.abs(p[2] - t[2]) <= tol;
      }
      function acc(pred) {
        var sx = 0, sy = 0, n = 0, bx0 = 1e9, by0 = 1e9, bx1 = -1, by1 = -1;
        for (var y = Y0; y <= Y1; y++) {
          for (var x = X0; x <= X1; x++) {
            if (!pred(rgb(x, y), x, y)) continue;
            sx += x; sy += y; n++;
            if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
            if (y < by0) by0 = y; if (y > by1) by1 = y;
          }
        }
        return n ? {
          n: n,
          质心: [+(sx / n).toFixed(2), +(sy / n).toFixed(2)],
          中点: [+((bx0 + bx1) / 2).toFixed(2), +((by0 + by1) / 2).toFixed(2)],
          bbox: [bx0, by0, bx1, by1], 宽: bx1 - bx0 + 1, 高: by1 - by0 + 1
        } : null;
      }

      var grn = acc(function (p) { return near(p, GREEN, 26); });
      out.绿圆 = grn;
      if (grn) {
        // 只在绿圆内部（再缩进 5px 避开白描边）找白像素 —— 那就是加号笔画
        var ix0 = grn.bbox[0] + 5, iy0 = grn.bbox[1] + 5, ix1 = grn.bbox[2] - 5, iy1 = grn.bbox[3] - 5;
        var white = acc(function (p, x, y) {
          return x >= ix0 && x <= ix1 && y >= iy0 && y <= iy1 && p[0] > 235 && p[1] > 235 && p[2] > 235;
        });
        out.白加号 = white;
        if (white) {
          out.偏差 = {
            质心差: [+(white.质心[0] - grn.质心[0]).toFixed(2), +(white.质心[1] - grn.质心[1]).toFixed(2)],
            中点差: [+(white.中点[0] - grn.中点[0]).toFixed(2), +(white.中点[1] - grn.中点[1]).toFixed(2)]
          };
          // 纯白（>250）的分布：按列 / 按行计数，用来分辨「真的是加号」还是「一地噪声」
          var xh = {}, yh = {}, pts = [];
          for (var yy = iy0; yy <= iy1; yy++) {
            for (var xx = ix0; xx <= ix1; xx++) {
              var t = rgb(xx, yy);
              if (t[0] > 250 && t[1] > 250 && t[2] > 250) {
                xh[xx] = (xh[xx] || 0) + 1;
                yh[yy] = (yh[yy] || 0) + 1;
                pts.push(xx + ',' + yy);
              }
            }
          }
          var kx = Object.keys(xh).map(Number).sort(function (a, b) { return a - b; });
          var ky = Object.keys(yh).map(Number).sort(function (a, b) { return a - b; });
          out.纯白像素 = pts.length;
          out.纯白x范围 = kx.length ? [kx[0], kx[kx.length - 1]] : null;
          out.纯白y范围 = ky.length ? [ky[0], ky[ky.length - 1]] : null;
          out.列直方图 = kx.map(function (x) { return x + ':' + xh[x]; }).join(' ');
          out.行直方图 = ky.map(function (y) { return y + ':' + yh[y]; }).join(' ');
        }
        out.圆顶距图底 = +(H - 1 - grn.bbox[1]).toFixed(1);
      }
    } catch (e) {
      out.error = 'canvas 读不了：' + e.message;
    }
    document.getElementById('PIXOUT').textContent = 'PIXSTART' + JSON.stringify(out, null, 1) + 'PIXEND';
  };
  img.onerror = function () {
    document.getElementById('PIXOUT').textContent = 'PIXSTART{"error":"图读不进来"}' + 'PIXEND';
  };
  img.src = src;
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>砚读 · 多宝格结构编辑器</title>
<style>
:root {
  --page: #EDEDEA; --card: #FFFFFF; --ink: #1E3D2C; --accent: #2E6B4A;
  --muted: #9A9A95; --line: #E4E4E0; --back: #D3DFD4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #DCDCD9; color: #22221F;
  min-height: 100vh; padding: 20px;
  display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap;
}
.panel { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
.panel h2 { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; letter-spacing: 1px; }

svg { display: block; touch-action: none; user-select: none; cursor: default; background: transparent; }
.plank { fill: #FFFFFF; filter: drop-shadow(1.5px 3px 2.5px rgba(126,148,132,.45)); cursor: move; }
.plank.sel { fill: #FFF6DA; }
.handle { fill: var(--accent); cursor: pointer; }
.handle:hover { fill: #3E8A61; }
.guide { stroke: #C6CFC7; stroke-width: 1; stroke-dasharray: 4 4; }
.rim { fill: none; stroke: #D6DBD6; stroke-width: 1; }

.ctrls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.ctrls button {
  border: 1px solid var(--line); background: #fff; border-radius: 8px;
  padding: 8px 12px; font-size: 13px; cursor: pointer; color: var(--ink);
  font-family: inherit;
}
.ctrls button:hover { background: #F2F4F1; }
.ctrls button.danger { color: #A33; border-color: #E8D5D5; }
.ctrls .row { display: flex; gap: 8px; }

textarea {
  width: 100%; height: 190px; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11.5px; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px; resize: vertical; line-height: 1.6; color: #333;
}
.tip { font-size: 11.5px; color: var(--muted); line-height: 1.75; margin-top: 10px; }
.tip b { color: var(--ink); }
.kbd { background: #EFEFEC; border-radius: 3px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>

<div class="panel">
  <h2>拖动摆结构</h2>
  <svg id="cv" width="460" height="460" viewBox="0 0 400 400">
    <defs>
      <radialGradient id="backG" cx="0.4" cy="0.34" r="0.78">
        <stop offset="0" stop-color="#DBE5DC"/>
        <stop offset="1" stop-color="#C9D7CB"/>
      </radialGradient>
      <clipPath id="inner"><circle cx="200" cy="200" r="168"/></clipPath>
    </defs>

    <circle cx="200" cy="200" r="177" fill="#FFFFFF"/>
    <circle cx="200" cy="200" r="169.5" fill="none" stroke="#A9B7AC" stroke-width="7" opacity="0.22"/>
    <circle cx="200" cy="200" r="168" fill="url(#backG)"/>
    <circle class="rim" cx="200" cy="200" r="168"/>

    <!-- 参考网格（可关） -->
    <g id="guides" clip-path="url(#inner)" opacity="0.5"></g>

    <g id="planks" clip-path="url(#inner)"></g>
    <g id="handles"></g>
  </svg>
  <div class="tip">
    拖动<b>板身</b>整体挪动 · 拖动<b>两端的小圆点</b>改长短 · 点一下选中<br>
    <span class="kbd">Delete</span> 删掉选中的板子
  </div>
</div>

<div class="panel" style="width:320px">
  <h2>操作</h2>
  <div class="ctrls">
    <div class="row">
      <button id="addH" style="flex:1">+ 横板</button>
      <button id="addV" style="flex:1">+ 竖撑</button>
    </div>
    <div class="row">
      <button id="del" class="danger" style="flex:1">删除选中</button>
      <button id="grid" style="flex:1">参考线</button>
    </div>
    <div class="row">
      <button id="reset" style="flex:1">重置</button>
      <button id="copy" style="flex:1">复制参数</button>
    </div>
  </div>
  <textarea id="out" readonly></textarea>
  <div class="tip">
    摆好后点<b>复制参数</b>，把内容发给我，我就按这个改。<br>
    参数里的数字是 SVG 坐标：圆心 <b>(200,200)</b>，内半径 <b>168</b>。
  </div>
</div>

<script>
var T = 8;
var R = 168, CX = 200, CY = 200;

/* 初始结构——随便给个起点，拖成你要的样子 */
var H = [
  [ 58, 130, 198],
  [272, 176, 364],
  [ 34, 196, 152],
  [232, 236, 364],
  [104, 306, 238]
];
var V = [
  [198,  74, 152],
  [288, 118, 176],
  [152, 196, 252],
  [232, 236, 306],
  [104, 252, 306]
];

var sel = null;          // {kind:'H'|'V', i:n}
var drag = null;         // {kind, i, part:'body'|'a'|'b', ...}
var showGrid = true;
var svg = document.getElementById('cv');

function pt(e) {
  var p = svg.createSVGPoint();
  var src = e.touches ? e.touches[0] : e;
  p.x = src.clientX; p.y = src.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
/* 让端点尽量落在圆内 */
function inCircle(x, y) {
  var dx = x - CX, dy = y - CY;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d <= R - 2) return [x, y];
  var k = (R - 2) / d;
  return [CX + dx * k, CY + dy * k];
}

function render() {
  var body = '', hs = '';

  H.forEach(function (p, i) {
    var x = Math.min(p[0], p[2]), w = Math.abs(p[2] - p[0]), y = p[1];
    body += '<rect class="plank' + (sel && sel.kind === 'H' && sel.i === i ? ' sel' : '') +
            '" data-k="H" data-i="' + i + '" x="' + x + '" y="' + (y - T / 2) +
            '" width="' + w + '" height="' + T + '" rx="1"/>';
    if (sel && sel.kind === 'H' && sel.i === i) {
      hs += '<circle class="handle" data-k="H" data-i="' + i + '" data-part="a" cx="' + x + '" cy="' + y + '" r="5"/>';
      hs += '<circle class="handle" data-k="H" data-i="' + i + '" data-part="b" cx="' + (x + w) + '" cy="' + y + '" r="5"/>';
    }
  });
  V.forEach(function (p, i) {
    var x = p[0], y = Math.min(p[1], p[2]), h = Math.abs(p[2] - p[1]);
    body += '<rect class="plank' + (sel && sel.kind === 'V' && sel.i === i ? ' sel' : '') +
            '" data-k="V" data-i="' + i + '" x="' + (x - T / 2) + '" y="' + y +
            '" width="' + T + '" height="' + h + '" rx="1"/>';
    if (sel && sel.kind === 'V' && sel.i === i) {
      hs += '<circle class="handle" data-k="V" data-i="' + i + '" data-part="a" cx="' + x + '" cy="' + y + '" r="5"/>';
      hs += '<circle class="handle" data-k="V" data-i="' + i + '" data-part="b" cx="' + x + '" cy="' + (y + h) + '" r="5"/>';
    }
  });

  document.getElementById('planks').innerHTML = body;
  document.getElementById('handles').innerHTML = hs;

  var g = '';
  if (showGrid) {
    for (var v = 60; v <= 340; v += 20) {
      g += '<line class="guide" x1="' + v + '" y1="30" x2="' + v + '" y2="370"/>';
      g += '<line class="guide" x1="30" y1="' + v + '" x2="370" y2="' + v + '"/>';
    }
  }
  document.getElementById('guides').innerHTML = g;

  document.getElementById('out').value =
    'H = ' + JSON.stringify(H) + ';\nV = ' + JSON.stringify(V) + ';';
}

function down(e) {
  var t = e.target;
  if (t.classList.contains('handle')) {
    sel = { kind: t.dataset.k, i: +t.dataset.i };
    drag = { kind: t.dataset.k, i: +t.dataset.i, part: t.dataset.part };
    render();
    e.preventDefault();
    return;
  }
  if (t.classList.contains('plank')) {
    sel = { kind: t.dataset.k, i: +t.dataset.i };
    drag = { kind: t.dataset.k, i: +t.dataset.i, part: 'body' };
    render();
    e.preventDefault();
  }
}
function move(e) {
  if (!drag) return;
  var p = pt(e);
  var arr = drag.kind === 'H' ? H[drag.i] : V[drag.i];
  if (drag.kind === 'H') {
    if (drag.part === 'body') {
      var w = arr[2] - arr[0];
      var nx = clamp(Math.round(p.x - w / 2), 20, 380 - w);
      var ny = clamp(Math.round(p.y), 40, 360);
      var c1 = inCircle(nx, ny), c2 = inCircle(nx + w, ny);
      arr[0] = Math.round(c1[0]); arr[1] = Math.round(c1[1]); arr[2] = Math.round(c2[0]);
    } else if (drag.part === 'a') {
      var c = inCircle(p.x, arr[1]);
      arr[0] = Math.round(clamp(c[0], 20, arr[2] - 10));
    } else {
      var c2b = inCircle(p.x, arr[1]);
      arr[2] = Math.round(clamp(c2b[0], arr[0] + 10, 380));
    }
  } else {
    if (drag.part === 'body') {
      var h = arr[2] - arr[1];
      var nxv = clamp(Math.round(p.x), 30, 370);
      var nyv = clamp(Math.round(p.y - h / 2), 40, 360 - h);
      var d1 = inCircle(nxv, nyv), d2 = inCircle(nxv, nyv + h);
      arr[0] = Math.round(d1[0]); arr[1] = Math.round(d1[1]); arr[2] = Math.round(d2[1]);
    } else if (drag.part === 'a') {
      var e1 = inCircle(arr[0], p.y);
      arr[1] = Math.round(clamp(e1[1], 40, arr[2] - 10));
    } else {
      var e2 = inCircle(arr[0], p.y);
      arr[2] = Math.round(clamp(e2[1], arr[1] + 10, 360));
    }
  }
  render();
  e.preventDefault();
}
function up() { drag = null; }

svg.addEventListener('mousedown', down);
svg.addEventListener('mousemove', move);
window.addEventListener('mouseup', up);
svg.addEventListener('touchstart', down, { passive: false });
svg.addEventListener('touchmove', move, { passive: false });
window.addEventListener('touchend', up);

document.addEventListener('keydown', function (e) {
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel) {
    (sel.kind === 'H' ? H : V).splice(sel.i, 1);
    sel = null; render();
  }
});

document.getElementById('addH').onclick = function () {
  H.push([90, 200, 240]); sel = { kind: 'H', i: H.length - 1 }; render();
};
document.getElementById('addV').onclick = function () {
  V.push([200, 160, 240]); sel = { kind: 'V', i: V.length - 1 }; render();
};
document.getElementById('del').onclick = function () {
  if (!sel) return;
  (sel.kind === 'H' ? H : V).splice(sel.i, 1);
  sel = null; render();
};
document.getElementById('grid').onclick = function () { showGrid = !showGrid; render(); };
document.getElementById('reset').onclick = function () {
  H = [[58,130,198],[272,176,364],[34,196,152],[232,236,364],[104,306,238]];
  V = [[198,74,152],[288,118,176],[152,196,252],[232,236,306],[104,252,306]];
  sel = null; render();
};
document.getElementById('copy').onclick = function () {
  var ta = document.getElementById('out');
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  this.textContent = '已复制 ✓';
  var b = this;
  setTimeout(function () { b.textContent = '复制参数'; }, 1400);
};

render();
</script>
</body>
</html>
